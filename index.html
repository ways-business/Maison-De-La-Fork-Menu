<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#a8c3eb" />
  <meta name="description" content="Maison De La Fork digital menu" />
  <title>Maison De La Fork — Menu</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page-backdrop" aria-hidden="true"></div>


  <main class="phone-shell" id="top">
    <div class="scroll-progress" aria-hidden="true"><span></span></div>

    <section class="menu-board" aria-labelledby="menu-title">
      <img
        class="background-drawing"
        src="assets/images/BackgroundDrawing.png"
        alt=""
        aria-hidden="true"
        draggable="false"
      />

      <div class="ambient ambient--one" aria-hidden="true"></div>
      <div class="ambient ambient--two" aria-hidden="true"></div>

      <header class="hero">
        <h1 class="hero__title" id="menu-title" aria-label="Maison De La Fork">
          <span class="hero__line">Maison</span>
          <span class="hero__line">De La</span>
          <span class="hero__line">Fork</span>
        </h1>
      </header>

      <div class="menu-content">
        <section class="menu-section" aria-label="Kebabs">
          <article class="menu-item reveal" tabindex="0">
            <div class="menu-item__row">
              <h2>Beef Kebab Torsh</h2>
              <p class="price" aria-label="25 dollars"><span class="currency-sign" aria-hidden="true">$</span>25</p>
            </div>
            <p class="menu-item__meta">Jasmine Rice <span aria-hidden="true">|</span> Yogurt Sumac</p>
          </article>

          <article class="menu-item reveal" tabindex="0">
            <div class="menu-item__row">
              <h2>Chicken Kebab Torsh</h2>
              <p class="price" aria-label="25 dollars"><span class="currency-sign" aria-hidden="true">$</span>25</p>
            </div>
            <p class="menu-item__meta">Jasmine Rice <span aria-hidden="true">|</span> Yogurt Sumac</p>
          </article>
        </section>

        <div class="section-rule reveal" aria-hidden="true"><span></span></div>

        <section class="menu-section drinks" aria-label="Drinks">
          <article class="menu-item reveal" tabindex="0">
            <div class="menu-item__row">
              <h2>Sour Cherry Iced Tea</h2>
              <p class="price" aria-label="6 dollars"><span class="currency-sign" aria-hidden="true">$</span>6</p>
            </div>
            <p class="menu-item__meta">Taste the Summer</p>
          </article>
        </section>
      </div>

      <div class="cupid-stage" aria-hidden="true">
        <div class="spark spark--one">✦</div>
        <div class="spark spark--two">✦</div>
        <div class="spark spark--three">✦</div>

        <img
          class="cupid"
          src="assets/images/cupid.png"
          alt=""
          draggable="false"
        />
      </div>
    </section>

    <footer class="site-footer">
      <div class="footer-copy reveal">
        <img class="brand-logo" src="assets/images/Logo.png" alt="Maison De La Fork" draggable="false" />

        <p class="footer-tagline">Follow us on social media.</p>
      </div>

      <nav class="socials reveal" aria-label="Social media">
        <a href="https://instagram.com/maisondelafork" target="_blank" rel="noopener noreferrer" aria-label="Maison De La Fork on Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="social-icon__fill" cx="17.4" cy="6.7" r="1"></circle>
          </svg>
        </a>
        <a href="https://www.youtube.com/@MaisonDeLaFork" target="_blank" rel="noopener noreferrer" aria-label="Maison De La Fork on YouTube">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 8.2a3 3 0 0 0-2.1-2.1C17 5.6 12 5.6 12 5.6s-5 0-6.9.5A3 3 0 0 0 3 8.2 31 31 0 0 0 2.5 12 31 31 0 0 0 3 15.8a3 3 0 0 0 2.1 2.1c1.9.5 6.9.5 6.9.5s5 0 6.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-3.8 31 31 0 0 0-.5-3.8Z"></path>
            <path class="social-icon__fill" d="m10 9 5 3-5 3V9Z"></path>
          </svg>
        </a>
        <a href="https://x.com/forkmaison" target="_blank" rel="noopener noreferrer" aria-label="Maison De La Fork on X">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 4.5h3.9l10.1 15H15L5 4.5Z"></path>
            <path d="m5 19.5 6.1-6.3M13 10.9l6-6.4"></path>
          </svg>
        </a>
      </nav>

      <a class="back-to-top" href="#top" aria-label="Back to top">↑</a>
    </footer>
  </main>

  <noscript>
    <style>
      .hero__line, .reveal { opacity: 1; transform: none; filter: none; clip-path: none; }
    </style>
  </noscript>
</body>
</html>
